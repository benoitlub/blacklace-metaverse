name = "blacklace-metaverse-adapter"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Valeurs non secrètes uniquement. Les clés API passent par `wrangler secret put`
# en production et par `.dev.vars` (gitignoré) en local.
[vars]
OCTOPUS_MODE = "mock"
OCTOPUS_BASE_URL = "https://octopus-engine-app.benoitlubert.workers.dev"
OCTOPUS_MISSION_PATH = "/mission"
OCTOPUS_CAPABILITY = "content.generate"
OCTOPUS_AUTHORIZED_RESOURCES = "mistral"
OCTOPUS_FALLBACK = "local"
MESH3D_PROVIDER = "mock"
REQUEST_TIMEOUT_MS = "20000"
